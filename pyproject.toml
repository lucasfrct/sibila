[project]
name = "sibila"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "bcrypt",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]
